# ─────────────────────────────────────────────────────────────────────────────
# tmux config — fresh start
# Ideas stitched from: OpalBolt/dotfiles (old) + binoymanoj/dotfiles.
# Dependency-light: no theme plugin, status bar hand-built from shell commands.
# See README.md next to this file for install + full keybinding guide.
# ─────────────────────────────────────────────────────────────────────────────

# ── Terminal & basics ────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
set-option -sa terminal-features ',xterm-kitty:RGB'   # primary terminal
set -g mouse on
set -g base-index 1            # windows start at 1 (so Alt+1..9 line up)
set -g pane-base-index 1
set -g renumber-windows on     # close a window → others slide down, no gaps
setw -g mode-keys vi
set -g status-keys vi
# NOTE: escape-time, history-limit, focus-events are handled by tmux-sensible.

# ── Reload & rename ──────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
# prefix + R: rename session, prompt prefilled with the current name
bind R command-prompt -I "#{session_name}" "rename-session '%%'"

# ── Alt+number → switch window (no prefix) ───────────────────────────────────
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :0

# ── Copy mode (vi) ────────────────────────────────────────────────────────────
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send -X rectangle-toggle

# prefix + X (capital): kill pane with NO confirm prompt. prefix + x still asks.
bind X kill-pane

# ── tmux-sessionizer (verify path — see README) ──────────────────────────────
bind-key f display-popup -E -w 70% -h 70% -x C -y C "$HOME/scripts/tmux-sessionizer.sh"

# ── Status bar (binoymanoj/tmux-minimal-theme, ported inline — no plugin) ─────
# Palette = Catppuccin Mocha (the theme's default). Swap the hex to retheme;
# alternates in README.md. Icons use \uXXXX (parsed by tmux) so this file stays
# plain ASCII yet renders glyphs via any Nerd Font.
set-environment -g BG_COLOR "#1A1D23"
set-environment -g ACTIVE_COLOR "#b4befe"
set-environment -g INACTIVE_COLOR "#6c7086"
set-environment -g TEXT_COLOR "#cdd6f4"
set-environment -g ACCENT_COLOR "#b4befe"
set-environment -g BORDER_COLOR "#44475a"

set -g status on
set -g status-position bottom
set -g status-interval 3
set -g status-justify left
set -g status-style "bg=$BG_COLOR,fg=$TEXT_COLOR"
set -g status-left-length 100
set -g status-right-length 100

set -g mode-style "bg=$ACTIVE_COLOR,fg=$BG_COLOR"
set -g pane-border-style "fg=$BORDER_COLOR"
set -g pane-active-border-style "fg=$ACTIVE_COLOR"
set -g window-status-separator ""
set -g clock-mode-style 24

set -g window-status-format "#[fg=$INACTIVE_COLOR,bg=$BG_COLOR] #I:#W "
set -g window-status-current-format "#[fg=$ACTIVE_COLOR,bg=$BG_COLOR,bold] #I:#W "

# status-left:  session-name │
set -g status-left "#[fg=$ACCENT_COLOR,bold]\uf489  #S #[fg=$INACTIVE_COLOR]│ "

# status-right:  path │  RAM │  day │  time
set -g status-right "\
#[fg=$ACCENT_COLOR]\uf07b #[fg=$TEXT_COLOR]#([ #{pane_current_path} = $HOME ] && echo '~' || basename #{pane_current_path}) \
#[fg=$INACTIVE_COLOR]│ \
#[fg=$ACCENT_COLOR]\uefc5 #[fg=$TEXT_COLOR]#(free | awk '/^Mem/ { printf(\"%.0f%%\", $3/$2 * 100 - 0.5) }') \
#[fg=$INACTIVE_COLOR]│ \
#[fg=$ACCENT_COLOR]\uf073 #[fg=$TEXT_COLOR]#(date +%d) \
#[fg=$INACTIVE_COLOR]│ \
#[fg=$ACCENT_COLOR]\uf017 #[fg=$TEXT_COLOR]#(date +%H:%M) "

# Battery segment — appended at load only if this machine actually has a battery
# (stays hidden on desktops; appears automatically on laptops).
if-shell 'ls /sys/class/power_supply/BAT*/capacity >/dev/null 2>&1' {
    set -ga status-right "#[fg=$INACTIVE_COLOR]│ #[fg=$ACCENT_COLOR]\uf240 #[fg=$TEXT_COLOR]#(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null)% "
}

# ── Plugins (managed by TPM) ─────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'        # sane defaults (escape-time, history-limit, focus-events…)
set -g @plugin 'tmux-plugins/tmux-pain-control'    # pane splits / nav / resize bindings
set -g @plugin 'tmux-plugins/tmux-resurrect'       # persist sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'       # auto-save every 15 min + restore on start
set -g @plugin 'christoomey/vim-tmux-navigator'    # seamless Ctrl+h/j/k/l between nvim splits & tmux panes

# resurrect / continuum settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-shell-history 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialise TPM (must stay last)
run '~/.config/tmux/plugins/tpm/tpm'

# If nvim ever swallows Esc, sensible sets escape-time 0; uncomment to bump it:
# set -sg escape-time 10
