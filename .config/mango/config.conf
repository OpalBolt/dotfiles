# -----------------------------------------------------------------------------
# Startup
# -----------------------------------------------------------------------------

# Start the status bar and wallpaper daemon once per Mango session.
exec-once=waybar
exec-once=awww-daemon

# -----------------------------------------------------------------------------
# Input
# -----------------------------------------------------------------------------

# Keyboard repeat timing and layouts. US AltGr International is the default;
# Super+M switches between it and Danish.
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us,dk
xkb_rules_variant=altgr-intl,

# Trackpad behavior.
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0

# Keep conventional scrolling for external mice.
mouse_natural_scrolling=0

# -----------------------------------------------------------------------------
# Focus and pointer behavior
# -----------------------------------------------------------------------------

# Focus follows the pointer and the pointer warps with keyboard-driven focus.
# Do not move focus implicitly across monitors or tags.
focus_on_activate=1
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0

# -----------------------------------------------------------------------------
# Tags and tiling
# -----------------------------------------------------------------------------

# Use nine independent tags. New windows become the master in a one-master
# stack, with the master taking 55 percent of the available width.
tag_num=9
new_is_master=1
default_nmaster=1
default_mfact=0.55
smartgaps=1

# Start every tag in the master-stack tile layout.
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# -----------------------------------------------------------------------------
# Appearance
# -----------------------------------------------------------------------------

# Use compact inner gaps, larger outer gaps, and a two-pixel border.
gappih=5
gappiv=5
gappoh=10
gappov=10
borderpx=2
no_border_when_single=0

# Window and border colors use Mango's RGBA hex format.
rootcolor=0x201b14ff
bordercolor=0x444444ff
focuscolor=0xc9b890ff
urgentcolor=0xad401fff

# Blur windows but not layer surfaces. Shadows and animations stay disabled.
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2
shadows=0
layer_shadows=0
animations=0
layer_animations=0

# Keep rounded corners at all times and slightly dim unfocused windows.
border_radius=8
no_radius_when_single=0
focused_opacity=0.9
unfocused_opacity=0.8

# -----------------------------------------------------------------------------
# Scratchpad behavior and rules
# -----------------------------------------------------------------------------

# Size and color shared by scratchpad windows.
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
scratchpadcolor=0x516c93ff

# Treat the dedicated WezTerm instance as the named terminal scratchpad.
windowrule=isnamedscratchpad:1,appid:mango-scratchpad

# -----------------------------------------------------------------------------
# Session and applications
# -----------------------------------------------------------------------------

bind=SUPER,r,reload_config
bind=SUPER+ALT,q,quit
bind=SUPER+SHIFT,l,spawn,swaylock
bind=SUPER,m,switch_keyboard_layout

bind=SUPER,Return,spawn,wezterm
bind=SUPER,d,spawn,fuzzel

# -----------------------------------------------------------------------------
# Window management
# -----------------------------------------------------------------------------

# Close, fullscreen, float, focus, and reorder tiled windows.
bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,s,togglefloating
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER+SHIFT,j,exchange_stack_client,next
bind=SUPER+SHIFT,k,exchange_stack_client,prev

# Select a layout directly rather than cycling through layouts.
bind=SUPER,Left,setlayout,tile
bind=SUPER,Right,setlayout,right_tile
bind=SUPER,Up,setlayout,vertical_tile
bind=SUPER,Down,setlayout,monocle

# Focus adjacent monitors, or send a window to the visible tag there.
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+SHIFT,comma,tagmon,left,0
bind=SUPER+SHIFT,period,tagmon,right,0

# Move and resize with the pointer; middle-click toggles floating.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,togglefloating

# -----------------------------------------------------------------------------
# Scratchpad bindings
# -----------------------------------------------------------------------------

# Super+S controls the named terminal. Super+I controls the generic pool, and
# Super+Shift+I sends the focused window to that pool.
bind=SUPER,s,toggle_named_scratchpad,mango-scratchpad,none,wezterm start --class mango-scratchpad
bind=SUPER,i,toggle_scratchpad
bind=SUPER+SHIFT,i,minimized

# -----------------------------------------------------------------------------
# Tag bindings
# -----------------------------------------------------------------------------

# View one tag with Super+1..9, or all tags with Super+0.
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,0,0

# Send the focused window without following it. The explicit Super+Shift+0
# mask assigns all nine tags; tagsilent,0 would remove every tag instead.
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9
bind=SUPER+SHIFT,0,tagsilent,1|2|3|4|5|6|7|8|9

# -----------------------------------------------------------------------------
# Audio, media, and brightness keys
# -----------------------------------------------------------------------------

# Adjust PipeWire volume in five-percent steps and cap output at 100 percent.
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Control MPRIS-compatible players with playerctl.
bind=NONE,XF86AudioMedia,spawn,playerctl play-pause
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next

# Adjust display brightness in five-percent steps.
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
