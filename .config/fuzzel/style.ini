# Fuzzel uses INI configuration rather than CSS. These values mirror Waybar's
# compact Ubuntu Nerd Font styling, rounded corners, and top placement.
[main]
font=ubuntu Nerd Font:size=12
use-bold=yes
anchor=top
y-margin=10
layer=top
width=50
lines=12
horizontal-pad=12
vertical-pad=10
inner-pad=8
minimal-lines=yes
match-counter=yes
image-size-ratio=0.5
scaling-filter=lanczos3

[border]
width=1
radius=10
selection-radius=8
