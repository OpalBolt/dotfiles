# Generated by the setup-pre-commit skill — regenerate with its assemble.sh.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # git does this itself; it also flags leftover conflict markers
      - id: whitespace
        name: whitespace and conflict markers
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: shfmt
        name: shfmt
        entry: shfmt --write
        language: system
        types: [shell]
        exclude: '\.zsh(rc|env)?$' # bash-only: it mangles or refuses zsh

  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2
        language: system
        types: [markdown]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: system
        types: [text]

  - repo: local
    hooks:
      # gitleaks runs on its embedded default rules; a repo needing extras
      # adds gitleaks.toml with useDefault = true, which extends them.
      - id: gitleaks
        name: gitleaks (staged)
        entry: gitleaks git --staged --redact
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: gitleaks-history
        name: gitleaks (full history)
        entry: gitleaks git --redact
        language: system
        pass_filenames: false
        stages: [pre-push]
